# Pushing a tag vX.Y.Z (matching VERSION) builds Nexus-Setup-X.Y.Z.exe and publishes it as a release,
# which is where Nexus looks for updates.
name: release
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches VERSION
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} but VERSION is $v" }

      - name: MinGW-w64 i686 with the msvcrt runtime (WinLibs), for Windows XP
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-msvcrt-r2/winlibs-i686-posix-dwarf-gcc-16.2.0-mingw-w64msvcrt-14.0.0-r2.zip"
          Invoke-WebRequest $url -OutFile mingw.zip
          Expand-Archive mingw.zip -DestinationPath C:\winlibs  # the runner already has a C:\mingw32
          "MINGW=C:\winlibs\mingw32" | Out-File $env:GITHUB_ENV -Append

      - name: NSIS
        run: choco install nsis -y --no-progress

      - name: Build
        shell: cmd
        run: build.bat

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          gh release create "${{ github.ref_name }}" "build/Nexus-Setup-$v.exe" --title "Nexus $v" --generate-notes
